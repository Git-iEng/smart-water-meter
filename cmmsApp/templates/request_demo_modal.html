{% load static %}
<style>
.form-captcha{
  width: 100%;
  margin: 18px 0 0;
  display: block;
}

.form-captcha .g-recaptcha{
  display: inline-block;
  background: #fff;
  border-radius: 10px;
  transform: none;
  -webkit-transform: none;
  transform-origin: left top;
  -webkit-transform-origin: left top;
}

.modal__footer{
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 18px;
  margin-top: 20px;
}

.btn-submit,
#submitBtn{
  position: static;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 170px;
  min-height: 58px;
  padding: 14px 28px;
  border: 0;
  border-radius: 999px;
  background: #c43a67;
  color: #fff;
  font-size: 18px;
  font-weight: 800;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 14px 30px rgba(196, 58, 103, 0.18);
}

.btn-submit .spinner,
#submitBtn .spinner{
  display: none;
}

.btn-submit.is-loading .spinner,
#submitBtn.is-loading .spinner{
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: btnSpin .8s linear infinite;
  margin-left: 10px;
}

@keyframes btnSpin{
  to{ transform: rotate(360deg); }
}

@media (max-width: 768px){
  .modal__footer{
    gap: 16px;
  }

  .btn-submit,
  #submitBtn{
    min-width: 150px;
    min-height: 54px;
    font-size: 24px;
    padding: 12px 24px;
  }
}

@media (max-width: 480px){
  .form-captcha{
    overflow-x: auto;
  }

  .form-captcha .g-recaptcha{
    transform: scale(0.92);
    -webkit-transform: scale(0.92);
    transform-origin: left top;
    -webkit-transform-origin: left top;
  }

  .btn-submit,
  #submitBtn{
    width: 100%;
    min-width: 100%;
    font-size: 22px;
  }
}
</style>

<!-- Request Demo Modal -->
<div class="modal" id="demoModal" aria-hidden="true">
  <div class="modal__backdrop" data-close-demo></div>

  <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="demoTitle">
    <button class="modal__close" type="button" data-close-demo aria-label="Close">×</button>

    <h2 id="demoTitle" class="modal__title">Submit Inquiry</h2>
    <p class="modal__subtitle">Fill in the details below and we’ll get you started.</p>

   <form id="demoForm" method="post" action="{% url 'cmmsApp:request_demo' %}" novalidate>
      {% csrf_token %}

      <div class="grid">
        <div class="field">
          <label for="full_name">Full Name*</label>
          <input id="full_name" name="full_name" type="text" placeholder="Name" required>
          <small class="error" data-error-for="full_name"></small>
        </div>

        <div class="field">
          <label for="company">Company*</label>
          <input id="company" name="company" type="text" placeholder="Company" required>
          <small class="error" data-error-for="company"></small>
        </div>

        <div class="field">
          <label for="email">Email*</label>
          <input id="email" name="email" type="email" placeholder="you@company.com" required>
          <small class="error" data-error-for="email"></small>
        </div>

        <div class="field">
          <label for="phone">Phone Number*</label>
          <input id="phone" name="phone" type="tel" placeholder="+61 4xx xxx xxx" required>
          <small class="error" data-error-for="phone"></small>
        </div>

        <div class="field">
          <label for="country">Country*</label>
          <select id="country" name="country" required></select>
          <small class="error" data-error-for="country"></small>
        </div>

        <div class="field">
          <label for="address">Address</label>
          <input id="address" name="address" type="text" placeholder="Address">
        </div>

        <div class="field field--full">
          <label for="message">More Information</label>
          <textarea id="message" name="message" rows="3" placeholder="Message"></textarea>
        </div>
      </div>

      <p class="privacy">
        Your privacy is important to us. We’ll only use your information to communicate about Smart water meter.
      </p>

            <div class="modal__footer">
              <div class="form-captcha">
                <div class="g-recaptcha" data-sitekey="{{ RECAPTCHA_SITE_KEY }}"></div>
              </div>

              <button class="btn-submit" id="submitBtn" type="submit" form="demoForm">
                <span class="btn-label">Submit</span>
                <span class="spinner" aria-hidden="true"></span>
              </button>
            </div>
    </form>
    
<!-- New footer OUTSIDE the form -->

  </div>
</div>
